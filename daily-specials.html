<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Promotions - O'naan Pizza</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@400;500;600;700&family=Lato:wght@300;400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/admin-styles.css">
    <style>
      .promo-thumb{width:90px;height:64px;object-fit:cover;border-radius:8px}
    </style>
  </head>
  <body>
    <!-- Mobile Hamburger Button -->
    <button class="admin-hamburger" id="adminHamburger" aria-label="Toggle menu">
      <span></span>
    </button>

    <!-- Mobile Overlay -->
    <div class="admin-overlay" id="adminOverlay"></div>

    <!-- Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-logo">
        <h3>O'naan Pizza</h3>
        <p>Administration</p>
      </div>
      <ul class="admin-nav">
        <li class="admin-nav-item">
          <a href="admin.html" class="admin-nav-link">
            <i class="fas fa-pizza-slice"></i>
            <span>Produits</span>
          </a>
        </li>
        <li class="admin-nav-item">
          <a href="daily-specials.html" class="admin-nav-link active">
            <i class="fas fa-tags"></i>
            <span>Promotions</span>
          </a>
        </li>
        <li class="admin-nav-item">
          <a href="site-config.html" class="admin-nav-link">
            <i class="fas fa-cog"></i>
            <span>Configurations</span>
          </a>
        </li>
        <li class="admin-nav-item">
          <a href="index.html" class="admin-nav-link" target="_blank">
            <i class="fas fa-external-link-alt"></i>
            <span>Voir le site</span>
          </a>
        </li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <div class="admin-header">
        <h1>Gestion des Promotions</h1>
        <p>Créez et gérez les offres spéciales affichées sur votre site</p>
      </div>

      <div class="row g-4">
        <div class="col-lg-6">
          <div class="glass-card">
            <div class="card-body">
              <h5 class="mb-3">Ajouter / Éditer une promotion</h5>
              <form id="promoForm">
                <input type="hidden" id="promoId">
                <div class="mb-3">
                  <label class="form-label">Titre *</label>
                  <input id="promoTitle" class="form-control" placeholder="Ex: Menu Étudiant" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Sous-titre *</label>
                  <input id="promoSubtitle" class="form-control" placeholder="Ex: -20% avec carte étudiante" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Badge (prix ou réduction)</label>
                  <input id="promoBadge" class="form-control" placeholder="Ex: -20%, 15€">
                  <small class="text-muted">Affiché sur le badge de la carte</small>
                </div>
                <div class="mb-3">
                  <label class="form-label">Image *</label>
                  <input id="promoImage" type="file" accept="image/*" class="form-control">
                  <div id="promoPreview" class="mt-2"></div>
                </div>
                <div class="d-flex gap-2">
                  <button class="btn btn-primary" id="savePromo">Enregistrer</button>
                  <button class="btn btn-outline-secondary" type="button" id="resetPromo">Réinitialiser</button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="glass-card h-100">
            <div class="card-body">
              <div class="d-flex align-items-center justify-content-between mb-3">
                <h5 class="mb-0">Promotions actives</h5>
                <button class="btn btn-sm btn-outline-secondary" id="refreshPromos">Rafraîchir</button>
              </div>
              <div id="promotionsList" class="list-group"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin-responsive.js"></script>
    <script src="js/promotions-admin.js"></script>
  </body>
</html>
