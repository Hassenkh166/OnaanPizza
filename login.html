<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - O'naan Pizza Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/assets/images/logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: url('assets/images/bg-admin.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
        }

        .login-card {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
        }

        .login-card h2 {
            color: #D4AF37;
            letter-spacing: 3px;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .login-logo {
            width: 120px;
            height: auto;
            max-height: 100px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(212, 175, 55, 0.3));
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            outline: none;
            transition: 0.3s;
            font-family: 'Montserrat', sans-serif;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .input-group input:focus {
            border-color: #D4AF37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .btn-gold {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #D4AF37, #F9E076);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 1rem;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 2rem;
                margin: 20px;
            }

            .login-card h2 {
                font-size: 1.5rem;
                letter-spacing: 2px;
            }
        }

        /* Loading spinner styles */
        .loading-spinner {
            display: none;
            justify-content: center;
            align-items: center;
            margin-top: 1rem;
            color: #D4AF37;
        }

        .loading-spinner.show {
            display: flex;
        }

        .loading-spinner .spinner-border {
            width: 1rem;
            height: 1rem;
        }

        /* Alert styles */
        .alert {
            padding: 12px 16px;
            margin: 10px 0;
            border-radius: 8px;
            color: white;
            font-family: 'Montserrat', sans-serif;
            text-align: center;
            border: 1px solid;
        }

        .alert-success {
            border-color: #D4AF37;
            background: rgba(212, 175, 55, 0.2);
        }

        .alert-danger {
            border-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.2);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo-container">
                <img src="assets/images/logo.png" alt="O'naan Pizza Logo" class="login-logo">
            </div>
            <h2>Bienvenue</h2>
            <form id="loginForm">
                <div class="input-group">
                    <input type="email" id="email" placeholder="Utilisateur" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Mot de passe" required>
                </div>
                <button type="submit" class="btn-gold">SE CONNECTER</button>
            </form>

            <!-- Zone des messages sous le bouton -->
            <div id="alertContainer"></div>
            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Connexion en cours...</span>
                </div>
                <span class="ms-2">Connexion en cours...</span>
            </div>
        </div>
    </div>

    <script type="module" src="js/login.js"></script>
</body>
</html>
