<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - O'naan Pizza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/admin-styles.css">
    <link rel="icon" href="/assets/images/NewLogo.png">
  </head>
  <body class="admin-body">
    <!-- Mobile Hamburger Button -->
    <button class="admin-hamburger" id="adminHamburger" aria-label="Toggle menu">
      <span></span>
    </button>

    <!-- Mobile Overlay -->
    <div class="admin-overlay" id="adminOverlay"></div>

    <!-- Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-logo">
        <h3>O'naan Pizza</h3>
        <p>Administration</p>
      </div>
      <ul class="admin-nav">
        <li class="admin-nav-item">
          <a href="admin.html" class="admin-nav-link active">
            <i class="fas fa-pizza-slice"></i>
            <span>Produits</span>
          </a>
        </li>
        <li class="admin-nav-item">
          <a href="daily-specials.html" class="admin-nav-link">
            <i class="fas fa-star"></i>
            <span>Promotions</span>
          </a>
        </li>
        <li class="admin-nav-item">
          <a href="site-config.html" class="admin-nav-link">
            <i class="fas fa-cog"></i>
            <span>Configuration</span>
          </a>
        </li>
        <li class="admin-nav-item admin-nav-sep">
          <a href="index.html" target="_blank" class="admin-nav-link">
            <i class="fas fa-external-link-alt"></i>
            <span>Voir le site</span>
          </a>
        </li>
        <li class="admin-nav-item">
          <a href="admin-newsletter.html" class="admin-nav-link">
            <i class="fas fa-envelope"></i>
            <span>Newsletter</span>
          </a>
        </li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <div class="admin-header">
        <h1><i class="fas fa-pizza-slice me-2" style="color: #E53935;"></i>Gestion des Produits</h1>
        <p>Ajoutez, modifiez ou supprimez vos produits</p>
      </div>

    <div class="container-fluid admin-panel">
      <div class=" mb-4 ">

     <div class="card mb-4">
         <div class="card-body">
          <h5>Ajouter une catégorie</h5>
          <form id="categoryForm" class="d-flex gap-2 align-items-center">
           <input id="categoryName" class="form-control" placeholder="Nom de la catégorie" required>
           <input type="hidden" id="editingCategory" value="">
           <select id="categoryIcon" class="form-select" style="width:160px;">
             <option value="">Icône</option>
             <option value="🍕">🍕 Pizza</option>
             <option value="🥖">🥖 Sandwich</option>
             <option value="🍽️">🍽️ Assiette</option>
             <option value="🍰">🍰 Dessert</option>
             <option value="🥤">🥤 Boisson</option>
             <option value="➕">➕ Supplément</option>
             <option value="🌯">🌯 Wrap</option>
             <option value="custom">Personnalisé...</option>
           </select>
           <div id="customIconOptions" class="d-none" style="display:inline-flex;gap:.5rem;align-items:center;">
             <input id="categoryIconFile" class="form-control" type="file" accept="image/*" style="width:180px;">
           </div>
           <div id="categoryIconPreviewWrap" class="d-none" style="margin-left:.5rem;">
             <img id="categoryIconPreview" src="" alt="icone" style="height:28px;width:28px;object-fit:contain;border-radius:6px;">
           </div>
           <button class="btn btn-success" id ="addCategory" type="button">Ajouter</button>
          </form>
         </div>
  <div class="card-body">
    <h5>Catégories existantes</h5>
    <div id="categoriesList" class="list-group"></div>
  </div>
      </div>


      <div class="card mb-4">
        <div class="card-body">
          <form id="productForm">
            <input type="hidden" id="productId">
            <div class="row g-2">
              <div class="col-md-4">
                <input id="productTitle" class="form-control" placeholder="Titre du produit" required>
              </div>
              <div class="col-md-3">
                <input id="productPrice" class="form-control" placeholder="Prix (ex: 9.50€)" required>
              </div>
              <div class="col-md-3">
                <select id="productCategory" class="form-select" required>
                  <option value="">Choisir une catégorie</option>
                </select>
              </div>
              <!-- image URL removed: use file upload only -->
              <div class="col-12 mt-2">
                <label class="form-label">téléverser une image</label>
                <input id="productFile" type="file" accept="image/*" class="form-control">
                <div id="preview" class="mt-2"></div>
              </div>
              <div class="col-12 mt-2">
                <textarea id="productDesc" rows="2" class="form-control" placeholder="Description"></textarea>
              </div>
              <div class="col-12 mt-2">
                <label class="form-label">IconButtons</label>
                <div id="iconButtons" class="d-flex gap-2">
                  <button type="button" class="btn btn-outline-danger product-icon-button" data-flag="spicy">🌶️ Épicé</button>
                  <button type="button" class="btn btn-outline-success product-icon-button" data-flag="new">✨ Nouveau</button>
                  <button type="button" class="btn btn-outline-warning product-icon-button" data-flag="popular">🔥 Populaire</button>
                </div>
              </div>
            </div>
            <div class="mt-3 d-flex gap-2">
              <button class="btn btn-primary" id="saveBtn">Ajouter / Enregistrer</button>
              <button class="btn btn-outline-secondary" id="resetBtn" type="button">Réinitialiser</button>
            </div>
          </form>
        </div>
      </div>

      <div id="productsList" class="list-group"></div>
    </div>
    </main>

    <!-- site configuration moved to site-config.html -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/admin-sidebar.js"></script>
    <!-- Confirmation Modal -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header"><h5 class="modal-title">Confirmer</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
          <div class="modal-body">Êtes-vous sûr(e) ?</div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
            <button id="confirmDeleteBtn" type="button" class="btn btn-danger">Supprimer</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Toasts -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index:1080">
      <div id="toastContainer"></div>
    </div>

    <script src="js/admin-responsive.js"></script>
  </body>
</html>
